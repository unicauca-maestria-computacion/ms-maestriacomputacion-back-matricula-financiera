spring:
  application:
    name: matricula-financiera
  profiles:
    active: dev
  sql:
    init:
      mode: never
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
  messages:
    basename: ValidationMessages
    encoding: UTF-8

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info
