spring:
  application:
    name: matricula-financiera
  profiles:
    active: dev
  messages:
    basename: ValidationMessages
    encoding: UTF-8

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Documentacion OpenAPI generada por springdoc a partir del codigo.
#   Especificacion : http://localhost:8092/v3/api-docs
#   Swagger UI     : http://localhost:8092/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
