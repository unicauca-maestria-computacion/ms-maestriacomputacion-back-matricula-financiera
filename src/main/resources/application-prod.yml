spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  # Sin valor por omision de forma deliberada: si la variable no se
  # suministra, la aplicacion no arranca. Un valor por defecto en el
  # perfil de produccion supondria firmar y validar los tokens con una
  # clave presente en el repositorio y por tanto conocida.
  jwt-secret: ${JWT_SECRET}
